        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ui-bg-oscuro': 'var(--ui-bg-oscuro)',
                        'ui-bg-claro': 'var(--ui-bg-claro)',
                        'ui-titulo-oscuro': 'var(--ui-titulo-oscuro)',
                        'ui-parrafo-oscuro': 'var(--ui-parrafo-oscuro)',
                        'ui-btn-bg': 'var(--ui-btn-bg)',
                        'ui-btn-text': 'var(--ui-btn-text)',
                        'ui-nav-text': 'var(--ui-nav-text)',
                        'ui-logo-spin': 'var(--ui-logo-spin)',
                        'ui-logo-gamma': 'var(--ui-logo-gamma)',
                        'sg-border-light': 'var(--sg-border-light)',

                        /* COLORES TARJETAS PLANES */
                        'ui-tarj-tit': 'var(--ui-tarj-tit)',
                        'ui-tarj-precio': 'var(--ui-tarj-precio)'
                    },
                    fontFamily: {
                        serif: ['var(--font-titulos)', 'serif'],
                        sans: ['var(--font-parrafos)', 'sans-serif'],
                        /* NUEVAS FUENTES */
                        menu: ['var(--font-menu)', 'sans-serif'],

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--ui-bg-oscuro);
            color: var(--ui-desc);
            font-family: var(--font-parrafos), sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .font-serif {
            font-family: var(--font-titulos), serif;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(30px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 100px;
        }

        @media (min-width: 768px) {
            .slide {
                align-items: center;
                padding-top: 0;
            }
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            z-index: 10;
        }

        .slide.prev-slide {
            transform: translateY(-30px);
        }

        /* LÍNEA DIVISORIA DEL MENÚ PARAMETRIZADA */
        nav {
            transition: all 0.4s ease;
            border-bottom: 3px solid var(--ui-linea-menu);
            background-color: var(--ui-bg-oscuro);
            z-index: 50;
        }

        .nav-link {
            position: relative;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            outline: none;
            color: var(--ui-nav-text);
        }

        .nav-link:hover,
        .nav-link.active-link {
            opacity: 1;
            color: var(--ui-nav-text);
        }

        /* BOTONES DE MENÚ (Desktop y Mobile) PARAMETRIZADOS */
        .btn-nav-contacto {
            border: 2px solid var(--ui-nav-cta-border);
            color: var(--ui-nav-cta-text);
            background-color: transparent;
        }

        .btn-nav-contacto:hover {
            background-color: var(--ui-nav-cta-hover-bg);
            color: var(--ui-nav-cta-hover-text);
            border-color: var(--ui-nav-cta-hover-bg);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }



        /* Animaciones para cambio de TABS */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

        // LÓGICA DE TABS
        function toggleTab(seccion, tab) {
            const contentInfo = document.getElementById(`content-${seccion}-info`);
            const contentPlanes = document.getElementById(`content-${seccion}-planes`);
            const tabInfo = document.getElementById(`tab-${seccion}-info`);
            const tabPlanes = document.getElementById(`tab-${seccion}-planes`);

            if (!contentInfo || !contentPlanes) return;

            if (tab === 'info') {
                contentInfo.classList.remove('hidden');
                contentInfo.classList.add('flex');
                contentPlanes.classList.add('hidden');
                contentPlanes.classList.remove('grid');

                tabInfo.classList.add('bg-ui-btn-bg', 'text-ui-btn-text');
                tabInfo.classList.remove('text-ui-desc', 'hover:bg-white/50', 'opacity-70');

                tabPlanes.classList.remove('bg-ui-btn-bg', 'text-ui-btn-text');
                tabPlanes.classList.add('text-ui-desc', 'hover:bg-white/50', 'opacity-70');
            } else {
                contentInfo.classList.add('hidden');
                contentInfo.classList.remove('flex');
                contentPlanes.classList.remove('hidden');
                contentPlanes.classList.add('grid');

                tabPlanes.classList.add('bg-ui-btn-bg', 'text-ui-btn-text');
                tabPlanes.classList.remove('text-ui-desc', 'hover:bg-white/50', 'opacity-70');

                tabInfo.classList.remove('bg-ui-btn-bg', 'text-ui-btn-text');
                tabInfo.classList.add('text-ui-desc', 'hover:bg-white/50', 'opacity-70');
            }
        }

        // GENERADOR DE PLANES CON TAMAÑOS INYECTADOS

                let featuresHTML = '';
                if (plan.features && plan.features.length > 0) {
                    plan.features.forEach(f => {
                        featuresHTML += `
                        <li class="flex items-start gap-2 text-sm text-ui-desc opacity-90 mb-3">
                            <svg class="w-4 h-4 mt-0.5 text-ui-btn-bg shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            <span class="leading-tight">${f}</span>

                    });

                html += `

                        <h3 class="${GLOBAL_CONFIG.tipografia.tamanos.tarjetaTitulo} font-bold text-ui-tarj-tit mb-1 font-tarjetas leading-tight">${plan.nombre}</h3>
                        <p class="text-xs text-ui-desc opacity-80 mb-4 h-8">${plan.desc}</p>
                        <div class="flex items-end gap-1">
                            <span class="${GLOBAL_CONFIG.tipografia.tamanos.tarjetaPrecio} font-black text-ui-tarj-precio leading-none tracking-tighter">${plan.precio}</span>
                            <span class="text-xs font-bold text-ui-desc opacity-60 uppercase tracking-wider mb-1">${plan.freq}</span>
                        </div>
                    </div>
                    <ul class="flex-1 mb-8 mt-2">
                        ${featuresHTML}
                    </ul>
                    <a href="${linkWa}" target="_blank" class="w-full text-center py-3.5 rounded-full font-bold text-xs uppercase tracking-widest text-ui-btn-bg border-2 border-ui-btn-bg group-hover:bg-ui-btn-bg group-hover:text-ui-btn-text transition-colors">
                        Elegir Plan
                    </a>
                </div>`;
            });
            return html;
        }

        // RENDERIZADO INICIAL

            setHTML('ui-tit-tarjetas', GLOBAL_CONFIG.textosUI.titTarjetas);
            setHTML('ui-desc-tarjetas', GLOBAL_CONFIG.textosUI.descTarjetas);
            setHTML('ui-cta-info-tarjetas', GLOBAL_CONFIG.textosUI.ctaInfoTarjetas);
            setHTML('content-tarjetas-planes', generarPlanesHTML(GLOBAL_CONFIG.textosUI.planesTarjetas, GLOBAL_CONFIG.identidad.nombreRed));

            setHTML('ui-tit-menus', GLOBAL_CONFIG.textosUI.titMenus);
            setHTML('ui-desc-menus', GLOBAL_CONFIG.textosUI.descMenus);
            setHTML('ui-cta-info-menus', GLOBAL_CONFIG.textosUI.ctaInfoMenus);
            setHTML('content-menus-planes', generarPlanesHTML(GLOBAL_CONFIG.textosUI.planesMenus, "Menús Digitales"));



            setHTML('ui-titulo-equipo', GLOBAL_CONFIG.textosUI.tituloEquipo);
            setHTML('ui-desc-equipo', GLOBAL_CONFIG.textosUI.descEquipo);

            // IMÁGENES
            setImg('img-jhonatan', GLOBAL_CONFIG.imagenes.fotoJhonatan);
            setImg('img-wendy', GLOBAL_CONFIG.imagenes.fotoWendy);
            setImg('img-spinjob', GLOBAL_CONFIG.imagenes.imgRed);
            setImg('img-tarjetas', GLOBAL_CONFIG.imagenes.imgTarjetas);
            setImg('img-menus-carousel-1', GLOBAL_CONFIG.imagenes.imgMenus1);
            setImg('img-menus-carousel-2', GLOBAL_CONFIG.imagenes.imgMenus2);

            // Inicializar Carrusel de Menús
            updateMenuCarousel();

            // ENLACES
            const btnRed = document.getElementById('btn-spinjob');

            const waLinks = document.querySelectorAll('.js-wa-link');
            const waUrlBase = `https://wa.me/${GLOBAL_CONFIG.identidad.whatsapp}?text=${encodeURIComponent(GLOBAL_CONFIG.identidad.mensajeWA)}`;
            waLinks.forEach(link => { link.href = waUrlBase; });
        });

        // LÓGICA DE CARRUSEL DE MENÚS
        let currentMenuSlide = 0;
        const totalMenuSlides = 2;
        let menusCarouselInterval = setInterval(nextMenuSlide, 4000);

        function resetMenusCarouselInterval() {
            clearInterval(menusCarouselInterval);
            menusCarouselInterval = setInterval(nextMenuSlide, 4000);
        }

        function updateMenuCarousel() {
            const container = document.getElementById('menus-carousel-slides');
            if (container) {
                container.style.transform = `translateX(-${currentMenuSlide * 100}%)`;
            }
            const dots = document.querySelectorAll('.menus-carousel-dot');
            dots.forEach((dot, index) => {
                if (index === currentMenuSlide) {
                    dot.style.opacity = '1';
                    dot.style.transform = 'scale(1.2)';
                    dot.style.backgroundColor = GLOBAL_CONFIG.coloresUI.botonFondo;
                } else {
                    dot.style.opacity = '0.45';
                    dot.style.transform = 'scale(1)';
                    dot.style.backgroundColor = '#FFFFFF';
                }
            });
        }

        function nextMenuSlide(e) {
            if (e) {
                e.stopPropagation();
                resetMenusCarouselInterval();
            }
            currentMenuSlide = (currentMenuSlide + 1) % totalMenuSlides;
            updateMenuCarousel();
        }

        function prevMenuSlide(e) {
            if (e) {
                e.stopPropagation();
                resetMenusCarouselInterval();
            }
            currentMenuSlide = (currentMenuSlide - 1 + totalMenuSlides) % totalMenuSlides;
            updateMenuCarousel();
        }

        function setMenuSlide(index, e) {
            if (e) {
                e.stopPropagation();
                resetMenusCarouselInterval();
            }
            currentMenuSlide = index;
            updateMenuCarousel();
        }

        // NAVEGACIÓN Y SCROLL
        const slides = document.querySelectorAll('.slide');
        const navLinks = document.querySelectorAll('.nav-link');
        const totalSlides = slides.length;
        let currentSlide = 0;
        let isAnimating = false;

        function goToSlide(index) {
            if (isAnimating || index === currentSlide || index < 0 || index >= totalSlides) return;
            isAnimating = true;
            slides[currentSlide].classList.remove('active');
            if (index > currentSlide) { slides[currentSlide].classList.add('prev-slide'); }
            else { slides[currentSlide].classList.remove('prev-slide'); }

            // Forzar el reseteo de tabs al cambiar de vista
            toggleTab('tarjetoso', 'info');
            toggleTab('tarjetas', 'info');
            toggleTab('menus', 'info');
            currentMenuSlide = 0;
            updateMenuCarousel();

            currentSlide = index;
            slides.forEach((slide, i) => { if (i !== currentSlide) slide.classList.remove('active'); });
            slides[currentSlide].classList.remove('prev-slide');
            slides[currentSlide].classList.add('active');

            updateNav();
            setTimeout(() => { isAnimating = false; }, 800);
        }

        function updateNav() {
            const navDots = document.querySelectorAll('.dot');
            navDots.forEach(dot => {
                if (parseInt(dot.dataset.target) === currentSlide) {
                    dot.style.opacity = '1';
                    dot.style.transform = 'scale(1.3)';
                    dot.style.backgroundColor = GLOBAL_CONFIG.coloresUI.botonFondo;
                } else {
                    dot.style.opacity = '0.3';
                    dot.style.transform = 'scale(1)';
                    dot.style.backgroundColor = GLOBAL_CONFIG.coloresUI.tituloColorPrincipal;
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active-link');
                if (parseInt(link.dataset.target) === currentSlide) {
                    link.classList.add('active-link');
                }
            });
        }

        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.scroll-area') || e.target.closest('.grid')) return;
            const isHorizontalScroll = Math.abs(e.deltaX) > Math.abs(e.deltaY);
            if (!isHorizontalScroll) {
                if (e.deltaY > 0) goToSlide(currentSlide + 1);
                else if (e.deltaY < 0) goToSlide(currentSlide - 1);
            }
        });

        let touchStartY = 0; let touchEndY = 0; let touchStartX = 0; let touchEndX = 0; let touchTarget = null;
        window.addEventListener('touchstart', e => { touchStartY = e.changedTouches[0].screenY; touchStartX = e.changedTouches[0].screenX; touchTarget = e.target; }, { passive: true });
        window.addEventListener('touchend', e => {
            touchEndY = e.changedTouches[0].screenY; touchEndX = e.changedTouches[0].screenX;
            if (touchTarget && (touchTarget.closest('.scroll-area') || touchTarget.closest('.grid'))) return;
            const swipeThreshold = 50; const yDiff = touchStartY - touchEndY; const xDiff = touchStartX - touchEndX;
            if (Math.abs(yDiff) > Math.abs(xDiff)) {
                if (yDiff > swipeThreshold) { goToSlide(currentSlide + 1); }
                else if (yDiff < -swipeThreshold) { goToSlide(currentSlide - 1); }
            }
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') goToSlide(currentSlide + 1);
            if (e.key === 'ArrowUp') goToSlide(currentSlide - 1);
        });

        updateNav();
